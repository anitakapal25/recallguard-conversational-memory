<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RecallGuard</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="app">

    <!-- Header -->
    <header class="header">

        <div>
            <h1>RecallGuard</h1>

            <p>
                Conversational Memory System
            </p>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            Memory Online
        </div>

    </header>


    <!-- Chat -->
    <main class="chat-container">

        <div
            id="chatMessages"
            class="messages"
        >

            <!-- Initial AI message -->
            <div class="message assistant">

                <div class="avatar">
                    AI
                </div>

                <div class="bubble">

                    <p>
                        Hello! I'm RecallGuard.
                    </p>

                    <p>
                        I can remember useful information
                        from our conversations.
                    </p>

                </div>

            </div>

        </div>


        <!-- Typing indicator -->
        <div
            id="typingIndicator"
            class="typing hidden"
        >

            <span></span>
            <span></span>
            <span></span>

        </div>


        <!-- Input -->
        <div class="input-area">

            <textarea
                id="messageInput"
                placeholder="Type a message..."
                rows="1"
            ></textarea>

            <button
                id="sendButton"
                onclick="sendMessage()"
            >
                Send
            </button>

        </div>


        <div class="hint">
            Press Enter to send • Shift + Enter for a new line
        </div>

    </main>

</div>


<script src="{{ url_for('static', filename='chat.js') }}"></script>

</body>

</html>
