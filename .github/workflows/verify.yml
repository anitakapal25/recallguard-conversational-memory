name: Core verification
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install Flask==3.1.2 chromadb==1.5.9 numpy==2.5.1 pytest==8.4.2 requests==2.34.2
      - run: python -m pytest -q --junitxml=verification/results/core-tests.xml
      - run: python contribution/verify_memory_contract.py
      - run: python verification/run_evaluation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: verification/results/
