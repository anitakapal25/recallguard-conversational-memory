services:
  - type: web
    name: recallguard
    runtime: python
    plan: free
    buildCommand: pip install -r deployment/requirements-cloud.txt && python deployment/cache_model.py
    startCommand: python deployment/serve_cloud.py
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: RECALLGUARD_RUNTIME
        value: cloud
      - key: SUPABASE_URL
        value: https://uacsiisnqwcmmbznhece.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: RECALLGUARD_API_KEYS
        sync: false
